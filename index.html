<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stryka Coach - مدربك الشخصي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a2f4d 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            color: #3b82f6;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(59, 130, 246, 0.5);
        }

        .header p {
            color: #94a3b8;
            font-size: 0.95em;
        }

        .persona-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .persona-btn {
            padding: 10px 15px;
            background: #1e293b;
            border: 2px solid #475569;
            color: #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.85em;
        }

        .persona-btn:hover {
            border-color: #3b82f6;
            background: #0f172a;
            color: #3b82f6;
        }

        .persona-btn.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        .chat-container {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 500px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 10px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 15px;
            border-radius: 8px;
            word-wrap: break-word;
            line-height: 1.5;
        }

        .message.user {
            background: #3b82f6;
            margin-left: 20px;
            text-align: left;
            color: white;
        }

        .message.assistant {
            background: #334155;
            margin-right: 20px;
            text-align: right;
            color: #e2e8f0;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            background: #0f172a;
            border: 2px solid #475569;
            border-radius: 8px;
            color: white;
            font-size: 0.95em;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #3b82f6;
        }

        input[type="text"]::placeholder {
            color: #64748b;
        }

        button {
            padding: 12px 25px;
            background: #3b82f6;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.95em;
        }

        button:hover:not(:disabled) {
            background: #2563eb;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        button:disabled {
            background: #64748b;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .error-message {
            color: #f87171;
            padding: 10px;
            background: #7f1d1d;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .success-message {
            color: #86efac;
            padding: 10px;
            background: #1b4d2d;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .language-selector {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            padding: 8px 12px;
            background: #0f172a;
            border: 2px solid #475569;
            color: #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            margin-right: 5px;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2em;
            }

            .chat-container {
                height: 400px;
            }

            .persona-selector {
                grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
                gap: 8px;
            }
        }

        /* Bottom Navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            background: rgba(15, 23, 42, 0.98);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 600px;
            margin: 0 auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #64748b;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 5px 15px;
            border-radius: 12px;
            text-decoration: none;
        }

        .nav-item:hover {
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            color: #3b82f6;
        }

        .nav-icon {
            font-size: 1.4rem;
        }

        .nav-label {
            font-weight: 500;
        }

        /* Page placeholders */
        .page-placeholder {
            display: none;
            padding: 40px 20px;
            text-align: center;
            color: #64748b;
        }

        .page-placeholder h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .page-placeholder.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ Stryka Coach</h1>
            <p>مدربك الشخصي لتحقيق أهدافك</p>
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 10px; color: #94a3b8; font-weight: 600;">اختر شخصيتك:</label>
            <div class="persona-selector">
                <button class="persona-btn active" onclick="selectPersona('leo', event)">🦁 Leo</button>
                <button class="persona-btn" onclick="selectPersona('nova', event)">⭐ Nova</button>
                <button class="persona-btn" onclick="selectPersona('zen', event)">🧘 Zen</button>
                <button class="persona-btn" onclick="selectPersona('vibe', event)">🔥 Vibe</button>
                <button class="persona-btn" onclick="selectPersona('sage', event)">🌟 Sage</button>
            </div>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 10px; color: #94a3b8; font-weight: 600;">اللغة:</label>
            <div class="language-selector">
                <button class="lang-btn active" onclick="selectLanguage('ar', event)">العربية</button>
                <button class="lang-btn" onclick="selectLanguage('en', event)">English</button>
                <button class="lang-btn" onclick="selectLanguage('fr', event)">Français</button>
                <button class="lang-btn" onclick="selectLanguage('es', event)">Español</button>
            </div>
        </div>

        <div id="errorContainer"></div>
        <div id="successContainer"></div>

        <!-- Page Placeholders -->
        <div id="page-roadmap" class="page-placeholder">
            <h2>🗺️ Roadmap</h2>
            <p>قريباً...</p>
        </div>
        <div id="page-plans" class="page-placeholder">
            <h2>📋 Plans</h2>
            <p>قريباً...</p>
        </div>
        <div id="page-social" class="page-placeholder">
            <h2>👥 Social</h2>
            <p>قريباً...</p>
        </div>
        <div id="page-settings" class="page-placeholder">
            <h2>⚙️ Settings</h2>
            <p>قريباً...</p>
        </div>

        <div class="chat-container" id="chat-container">
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="اكتب هدفك أو سؤالك..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()" id="sendBtn">إرسال</button>
            </div>
        </div>

        <!-- Spacer for bottom nav -->
        <div style="height: 60px;"></div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a class="nav-item active" onclick="switchPage('coach')">
            <span class="nav-icon">⚡</span>
            <span class="nav-label">Coach</span>
        </a>
        <a class="nav-item" onclick="switchPage('roadmap')">
            <span class="nav-icon">🗺️</span>
            <span class="nav-label">Roadmap</span>
        </a>
        <a class="nav-item" onclick="switchPage('plans')">
            <span class="nav-icon">📋</span>
            <span class="nav-label">Plans</span>
        </a>
        <a class="nav-item" onclick="switchPage('social')">
            <span class="nav-icon">👥</span>
            <span class="nav-label">Social</span>
        </a>
        <a class="nav-item" onclick="switchPage('settings')">
            <span class="nav-icon">⚙️</span>
            <span class="nav-label">Settings</span>
        </a>
    </nav>

    <script>
        let currentPersona = 'leo';
        let currentLanguage = 'ar';
        let conversationId = null;
        let isLoading = false;

        function switchPage(page) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelector(`.nav-item[onclick="switchPage('${page}')"]`).classList.add('active');
            
            const chatContainer = document.getElementById('chat-container');
            const pagePlaceholders = document.querySelectorAll('.page-placeholder');
            
            if (page === 'coach') {
                chatContainer.style.display = 'flex';
                pagePlaceholders.forEach(p => p.classList.remove('active'));
            } else {
                chatContainer.style.display = 'none';
                pagePlaceholders.forEach(p => p.classList.remove('active'));
                const targetPage = document.getElementById(`page-${page}`);
                if (targetPage) targetPage.classList.add('active');
            }
        }

        function selectPersona(persona, event) {
            currentPersona = persona;
            document.querySelectorAll('.persona-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function selectLanguage(lang, event) {
            currentLanguage = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !isLoading) {
                sendMessage();
            }
        }

        function displayError(message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `<div class="error-message">❌ ${message}</div>`;
            setTimeout(() => {
                errorContainer.innerHTML = '';
            }, 5000);
        }

        function displaySuccess(message) {
            const successContainer = document.getElementById('successContainer');
            successContainer.innerHTML = `<div class="success-message"><span class="status-indicator"></span>${message}</div>`;
            setTimeout(() => {
                successContainer.innerHTML = '';
            }, 3000);
        }

        async function initializeConversation() {
            try {
                const response = await fetch('/api/coach/conversations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: `${currentPersona}: New Goal` })
                });
                if (!response.ok) throw new Error('Failed to create conversation');
                const data = await response.json();
                conversationId = data.id;
                displayMessage(data.welcome || 'مرحباً! أنا مدربك الشخصي. أخبرني عن هدفك.', 'assistant');
                displaySuccess('تم الاتصال بالخادم بنجاح');
            } catch (error) {
                displayError('فشل تهيئة المحادثة. تحقق من الاتصال وحاول مجدداً.');
            }
        }

        function displayMessage(content, role) {
            const messagesDiv = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.textContent = content;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput').value.trim();
            if (!input || isLoading) return;

            if (!conversationId) {
                await initializeConversation();
            }

            displayMessage(input, 'user');
            document.getElementById('userInput').value = '';
            isLoading = true;
            document.getElementById('sendBtn').disabled = true;

            try {
                const response = await fetch('/api/coach/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        conversationId,
                        content: input,
                        persona: currentPersona,
                        language: currentLanguage
                    })
                });

                if (!response.ok) throw new Error('Failed to get response');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let assistantMessage = '';
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;

                            try {
                                const parsed = JSON.parse(data);
                                if (parsed.content) {
                                    assistantMessage += parsed.content;
                                } else if (parsed.error) {
                                    displayError(parsed.error);
                                }
                            } catch (e) {
                                // Silent parsing error
                            }
                        }
                    }
                }

                if (assistantMessage) {
                    displayMessage(assistantMessage, 'assistant');
                }
            } catch (error) {
                displayError('خطأ في الاتصال. تحقق من الخادم وحاول مجدداً.');
            } finally {
                isLoading = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('userInput').focus();
            }
        }

        window.addEventListener('load', () => {
            initializeConversation();
        });
    </script>
</body>
</html>
