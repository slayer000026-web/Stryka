<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Stryka Coach</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; padding: 20px; }
        .chat-box { width: 100%; max-width: 500px; background: #1e293b; padding: 20px; border-radius: 10px; }
        input { width: 100%; padding: 10px; margin-top: 10px; color: black; box-sizing: border-box; }
        button { margin-top: 10px; width: 100%; padding: 10px; background: #3b82f6; border: none; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-box">
        <h2>Stryka Coach</h2>
        <div id="messages"></div>
        <input type="text" id="userInput" placeholder="اكتب هدفك هنا...">
        <button onclick="sendMessage()">إرسال</button>
    </div>
    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput').value;
            try {
                // استبدل الرابط أدناه برابط مشروعك الحقيقي على Replit
                const response = await fetch('https://YOUR_REPLIT_URL.replit.app/api/coach/chat', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        conversationId: 1, 
                        content: input, 
                        persona: 'leo', 
                        language: 'ar' 
                    })
                });
                if (response.ok) {
                    alert("تم إرسال الرسالة للمدرب بنجاح!");
                } else {
                    alert("حدث خطأ في الاتصال بالخادم");
                }
            } catch (error) {
                alert("خطأ: تعذر الوصول إلى الخادم");
            }
        }
    </script>
</body>
</html>
